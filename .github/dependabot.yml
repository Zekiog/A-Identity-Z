# Dependabot updates only where a manifest exists.
version: 2
updates:
- package-ecosystem: npm
  directory: /A_ID/frontend
  schedule:
    interval: weekly
    day: monday
    time: 09:00
  open-pull-requests-limit: 5
  reviewers:
  - Zekiog
  labels:
  - dependencies
  - automated
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  reviewers:
  - Zekiog
  labels:
  - dependencies
  - automated
